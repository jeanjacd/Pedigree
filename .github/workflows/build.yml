# Runs the planner tests on every push. They need no game files: the fixtures are exported from real saves.
name: tests
on:
  push:
  pull_request:
jobs:
  planner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Planner tests
        run: dotnet run --project tests/Pedigree.Tests -c Release -- tests/fixtures
